<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Topic Page</title>

<style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #F3F4FA;
      padding: 20px;
      color: #28345C;
    }

    /* Header */
    .header {
      text-align: center;
      padding: 15px;
      border: 1px solid #28345C;
      border-radius: 15px;
      font-size: 26px;
      font-weight: bold;
      background: #28345C;
      color: #FFFFFF;
      margin-bottom: 30px;
    }

    /* Query Box */
    .query-box {
      background: #FFFFFF;
      border: 0px solid #D6D9EA;
      border-radius: 15px;
      padding: 15px;
      margin-bottom: 20px;
    }

    .query-title {
      font-size: 18px;
      margin-bottom: 10px;
      color: #28345C;
    }

    button {
      padding: 6px 12px;
      border: none;
      border-radius: 15px;
      background: #28345C;
      color: #FFFFFF;
      cursor: pointer;
    }

    button:hover {
      background: #6556B8;
    }

    /* Answer Section */
    .answer {
      display: none;
      margin-top: 15px;
      border-top: 2px solid #D6D9EA;
      padding-top: 10px;
    }

    .answer-container {
      display: flex;
      gap: 20px;
    }

    .query-code {
      width: 50%;
      background: #F3F4FA;
      padding: 10px;
      border: 1px solid #D6D9EA;
      border-radius: 5px;
      font-family: monospace;
      color: #28345C;
    }

    .output {
      width: 50%;
      background: #F3F4FA;
      padding: 10px;
      border: 1px solid #D6D9EA;
      border-radius: 5px;
      font-family: monospace;
      color: #28345C;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      border-radius: 5px;
    }

    th, td {
      border: 1px solid #C5C9DC;
      border-radius: 5px;
      padding: 6px;
      text-align: center;
      color: #28345C;
    }

    /* Responsive */
    @media (max-width: 700px) {
      .answer-container {
        flex-direction: column;
      }

      .query-code, .output {
        width: 100%;
      }
    }
</style>
</head>
