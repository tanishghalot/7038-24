<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Topic Page</title>

<style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #F3F4FA;
      padding: 20px;
      color: #28345C;
    }

    /* Header */
    .header {
      text-align: center;
      padding: 15px;
      border: 1px solid #28345C;
      border-radius: 15px;
      font-size: 26px;
      font-weight: bold;
      background: #28345C;
      color: #FFFFFF;
      margin-bottom: 30px;
    }

    /* Query Box */
    .query-box {
      background: #FFFFFF;
      border: 0px solid #D6D9EA;
      border-radius: 15px;
      padding: 15px;
      margin-bottom: 20px;
    }

    .query-title {
      font-size: 18px;
      margin-bottom: 10px;
      color: #28345C;
    }

    button {
      padding: 6px 12px;
      border: none;
      border-radius: 15px;
      background: #28345C;
      color: #FFFFFF;
      cursor: pointer;
    }

    button:hover {
      background: #6556B8;
    }

   /* Answer Section */
.answer {
  display: none;
  margin-top: 15px;
  border-top: 2px solid #D6D9EA;
  padding-top: 10px;
}

.answer-container {
  display: block;
}

.query-code {
  width: auto;
  background: #F3F4FA;
  padding: 10px;
  border: none;
  border-radius: 5px;
  font-family: monospace;
  color: #28345C;
  margin-bottom: 8px;
  white-space: pre-wrap;
}

.output {
  width: auto;
  background: #F3F4FA;
  padding: 10px;
  border: none;
  border-radius: 5px;
  font-family: monospace;
  color: #6556B8;
  white-space: pre-wrap;
}


    /* Responsive */
   .answer-container {
  flex-direction: column;
}

.query-code, .output {
  width: 100%;
}
    }
</style>
</head>

<body>

  <!-- Topic Title -->
  <div class="header" id="SINGLED">
    SINGLE DIMENSION ARRAY
  </div>

  <!-- Query List -->
  <div id="quesList"></div>

<script>
    // SAMPLE DATA
    const topicData = {
        title: "SINGLE DIMENSION ARRAY",

        questions: [
            {
                question: "Program to find the second smallest number in an array",

                source_code: `package SingleD_array;

class SecondSmallestDigit {
    public static void main(String args[]) {

        int arr[] = {2,3,4,7,4,5,8};
        int len = arr.length;

        int s_index = 0;
        int s_index_sec = -1;

        for(int i = 1; i < len; i++) {
            if(arr[i] < arr[s_index]) {
                s_index = i;
            }
        }

        for(int j = 0; j < len; j++) {
            if(arr[j] > arr[s_index]) {
                if(s_index_sec == -1 || arr[j] < arr[s_index_sec]) {
                    s_index_sec = j;
                }
            }
        }

        if(s_index_sec != -1) {
            System.out.println("The second smallest number is: " + arr[s_index_sec]);
        }
    }
}`,

                output: "The second smallest number in the array is: 3"
            },

            {
                question: "2. Program to find the frequency of each element in the array",
                source_code: "https://c4knowledgeseekers.in/practice/core-java-programming/arrays/370",
                output: ""
            },
            {
                question: "3. Program to left rotate the elements of an array",
                source_code: "https://c4knowledgeseekers.in/practice/core-java-programming/arrays/371",
                output: ""
            },
            {
                question: "4. Program to print the duplicate elements of an array",
                source_code: "https://c4knowledgeseekers.in/practice/core-java-programming/arrays/372",
                output: ""
            },
            {
                question: "5. Program to print the elements of an array",
                source_code: "https://c4knowledgeseekers.in/practice/core-java-programming/arrays/373",
                output: ""
            },
            {
                question: "6. Program to print the elements of an array in reverse order",
                source_code: "https://c4knowledgeseekers.in/practice/core-java-programming/arrays/374",
                output: ""
            },
            {
                question: "7. Program to print the elements of an array present on even position",
                source_code: "https://c4knowledgeseekers.in/practice/core-java-programming/arrays/375",
                output: ""
            },
            {
                question: "8. Program to print the elements of an array present on odd position",
                source_code: "https://c4knowledgeseekers.in/practice/core-java-programming/arrays/376",
                output: ""
            },
            {
                question: "9. Program to print the largest element in an array",
                source_code: "https://c4knowledgeseekers.in/practice/core-java-programming/arrays/377",
                output: ""
            },
            {
                question: "10. Program to print the smallest element in an array",
                source_code: "https://c4knowledgeseekers.in/practice/core-java-programming/arrays/378",
                output: ""
            },
            {
                question: "11. Program to print the number of elements present in an array",
                source_code: "https://c4knowledgeseekers.in/practice/core-java-programming/arrays/379",
                output: ""
            },
            {
                question: "12. Program to print the sum of all the items of the array",
                source_code: "https://c4knowledgeseekers.in/practice/core-java-programming/arrays/380",
                output: ""
            },
            {
                question: "13. Program to right rotate the elements of an array",
                source_code: "https://c4knowledgeseekers.in/practice/core-java-programming/arrays/381",
                output: ""
            },
            {
                question: "14. Program to sort the elements of an array in ascending order",
                source_code: "https://c4knowledgeseekers.in/practice/core-java-programming/arrays/382",
                output: ""
            },
            {
                question: "15. Program to sort the elements of an array in descending order",
                source_code: "https://c4knowledgeseekers.in/practice/core-java-programming/arrays/383",
                output: ""
            },
            {
                question: "16. Program to find 3rd Largest Number in an array",
                source_code: "https://c4knowledgeseekers.in/practice/core-java-programming/arrays/384",
                output: ""
            },
            {
                question: "17. Program to find 2nd Largest Number in an array",
                source_code: "https://c4knowledgeseekers.in/practice/core-java-programming/arrays/385",
                output: ""
            },
            {
                question: "18. Program to find Largest Number in an array",
                source_code: "https://c4knowledgeseekers.in/practice/core-java-programming/arrays/386",
                output: ""
            },
            {
                question: "19. Program to find 2nd Smallest Number in an array",
                source_code: "https://c4knowledgeseekers.in/practice/core-java-programming/arrays/387",
                output: ""
            },
            {
                question: "20. Program to find Smallest Number in an array",
                source_code: "https://c4knowledgeseekers.in/practice/core-java-programming/arrays/388",
                output: ""
            },
            {
                question: "21. Program to remove duplicate elements in an array",
                source_code: "https://c4knowledgeseekers.in/practice/core-java-programming/arrays/389",
                output: ""
            },
            {
                question: "22. Program to print odd and even numbers from an array",
                source_code: "https://c4knowledgeseekers.in/practice/core-java-programming/arrays/390",
                output: ""
            },
            {
                question: "23. How to sort an array in Java",
                source_code: "https://c4knowledgeseekers.in/practice/core-java-programming/arrays/391",
                output: ""
            }
        ]
    };

    // Set Title
    document.getElementById("SINGLED").innerText = topicData.title;

    const container = document.getElementById("quesList");

    // Create Questions
    topicData.questions.forEach((q, index) => {

        const div = document.createElement("div");
        div.className = "query-box";

        const title = document.createElement("div");
        title.className = "query-title";
        title.textContent = `(${index + 1}) ${q.question}`;

        const button = document.createElement("button");
        button.textContent = "Show Answer";
        button.onclick = () => toggleAnswer(index);

        const answer = document.createElement("div");
        answer.className = "answer";
        answer.id = `answer-${index}`;

        const answerContainer = document.createElement("div");
        answerContainer.className = "answer-container";

        // Source Code Section
        const codeDiv = document.createElement("div");
        codeDiv.className = "query-code";

        const codeTitle = document.createElement("strong");
        codeTitle.textContent = "Source Code:";

        codeDiv.appendChild(codeTitle);
        codeDiv.appendChild(document.createElement("br"));

        // Check whether source_code is a URL or Java code
        if (q.source_code.startsWith("http")) {

            const link = document.createElement("a");
            link.href = q.source_code;
            link.textContent = "Start Solving";
            link.target = "_blank";
            link.rel = "noopener noreferrer";

            codeDiv.appendChild(link);

        } else {

            const pre = document.createElement("pre");
            const code = document.createElement("code");

            code.className = "language-java";
            code.textContent = q.source_code;

            pre.appendChild(code);
            codeDiv.appendChild(pre);

            // Apply Syntax Highlighting
            hljs.highlightElement(code);
        }

        // Output Section
        const outputDiv = document.createElement("div");
        outputDiv.className = "output";

        const outputTitle = document.createElement("strong");
        outputTitle.textContent = "Output:";

        const outputText = document.createElement("p");
        outputText.textContent = q.output || "Output not added yet.";

        outputDiv.appendChild(outputTitle);
        outputDiv.appendChild(document.createElement("br"));
        outputDiv.appendChild(outputText);

        answerContainer.appendChild(codeDiv);
        answerContainer.appendChild(outputDiv);

        answer.appendChild(answerContainer);

        div.appendChild(title);
        div.appendChild(button);
        div.appendChild(answer);

        container.appendChild(div);
    });

    // Toggle Answer
    function toggleAnswer(index) {

        const ans = document.getElementById(`answer-${index}`);

        ans.style.display =
            ans.style.display === "block" ? "none" : "block";
    }

</script>
</body>
</html>


</body>
</html>
